<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241f3a">
<title>The lovely lady who has my heart</title>
<style>
  :root{ --paper:#141824; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;background:#0f1119;overflow-x:hidden;}
  body{
    min-height:100vh;min-height:100svh;
    display:flex;align-items:stretch;justify-content:center;
    padding:max(8px,env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }

  /* cold press paper: fibre, tooth, and a warm cast */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='a'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23a)' opacity='0.55'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='340' height='340'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='0.13' numOctaves='2'/></filter><rect width='340' height='340' filter='url(%23b)' opacity='0.34'/></svg>");
    mix-blend-mode:overlay;opacity:.22;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:7;
    background:
      radial-gradient(ellipse at 50% 36%, rgba(52,44,72,0) 52%, rgba(5,6,11,.6) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2'/></filter><rect width='150' height='150' filter='url(%23c)' opacity='0.4'/></svg>");
    mix-blend-mode:multiply;opacity:.5;
  }

  .wrap{width:100%;max-width:720px;min-height:calc(100svh - 40px);position:relative;z-index:1;
    display:flex;flex-direction:column;justify-content:center;}
  /* full-bleed: cancel the body's side padding so the bouquet gets the whole width */
  .stage{flex:0 1 auto;width:calc(100% + 24px);margin-inline:-12px;
    /* matches the viewBox, so the box hugs the art instead of padding it with slack */
    aspect-ratio:825/1000;
    max-height:calc(100svh - 172px);
    /* px floor so it still shows if the frame reports no height,
       low enough that a landscape phone keeps the button above the fold */
    min-height:clamp(180px,46svh,560px);}
  .stage svg{display:block;width:100%;height:100%;}
  .note,.underline,.btn{flex:0 0 auto;}
  .trigger{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}

  /* plays on load: nothing waits for a click, so it works in any preview frame */
  .grow{transform:scaleY(0);transform-origin:0 0;
    animation:growA 2.6s cubic-bezier(.36,.72,.3,1) var(--d,0s) both;}
  @keyframes growA{to{transform:scaleY(1)}}
  @keyframes growB{to{transform:scaleY(1)}}
  .leaf-g{transform:scale(.05) rotate(-9deg);transform-origin:0 0;opacity:0;
    animation:leafA 2s cubic-bezier(.24,.9,.3,1) var(--d) both;}
  @keyframes leafA{to{transform:scale(1) rotate(0deg);opacity:1}}
  @keyframes leafB{to{transform:scale(1) rotate(0deg);opacity:1}}
  .petal{transform-origin:0 0;transform:rotate(var(--c)) translateY(var(--ct,0px));
    animation:petalA 2.8s cubic-bezier(.2,.85,.25,1) var(--d) both;}
  @keyframes petalA{to{transform:rotate(var(--o)) translateY(var(--ot,0px))}}
  @keyframes petalB{to{transform:rotate(var(--o)) translateY(var(--ot,0px))}}
  .stamens{transform:scale(.2);transform-origin:0 0;opacity:0;
    animation:stamA 1.8s cubic-bezier(.24,.9,.3,1) var(--d) both;}
  @keyframes stamA{to{transform:scale(1);opacity:1}}
  @keyframes stamB{to{transform:scale(1);opacity:1}}

  .wash{opacity:0;animation:washA 2.4s ease var(--d,2.8s) both;}
  @keyframes washA{to{opacity:.38}}
  @keyframes washB{to{opacity:.38}}

  .paperback,.paperfront{opacity:0;transform:scale(.9);transform-origin:0 0;
    animation:paperA 1.8s cubic-bezier(.24,.9,.3,1) both;}
  .paperback{animation-delay:.2s;}
  .paperfront{animation-delay:2.0s;}
  @keyframes paperA{to{opacity:1;transform:scale(1)}}
  @keyframes paperB{to{opacity:1;transform:scale(1)}}

  .cutends{opacity:0;animation:cutA 1.4s ease .4s both;}
  @keyframes cutA{to{opacity:1}}
  @keyframes cutB{to{opacity:1}}
  .ribbon{opacity:0;transform:scale(.86) rotate(-6deg);transform-origin:0 0;
    animation:ribbonA 1.4s cubic-bezier(.24,.9,.3,1) 2.5s both;}
  @keyframes ribbonA{to{opacity:1;transform:scale(1) rotate(0deg)}}
  @keyframes ribbonB{to{opacity:1;transform:scale(1) rotate(0deg)}}

  .head{transform-origin:0 0;animation:sway 13s ease-in-out infinite alternate;}
  @keyframes sway{from{transform:rotate(-.9deg)}to{transform:rotate(.9deg)}}

  /* the line writes itself once the flowers are open */
  .note{
    text-align:center;margin:clamp(2px,1.4vw,8px) 0 0;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-style:italic;color:#f4e7d2;text-shadow:0 0 22px rgba(255,214,160,.22);
    font-size:clamp(17px,5vw,27px);line-height:1.25;letter-spacing:.012em;
  }
  .ink{
    display:inline-block;position:relative;
    -webkit-clip-path:inset(0 102% -20% -2%);clip-path:inset(0 102% -20% -2%);
    animation:inkA 3.4s cubic-bezier(.45,.05,.25,1) 9.3s both;
  }
  @keyframes inkA{to{-webkit-clip-path:inset(0 -2% -20% -2%);clip-path:inset(0 -2% -20% -2%)}}
  @keyframes inkB{to{-webkit-clip-path:inset(0 -2% -20% -2%);clip-path:inset(0 -2% -20% -2%)}}
  .underline{
    display:block;height:1px;width:0;margin:clamp(6px,1.6vw,10px) auto 0;
    background:linear-gradient(90deg,rgba(230,200,130,.06),rgba(230,200,130,.62),rgba(230,200,130,.06));
    animation:lineA 2.4s ease 12.5s both;
  }
  @keyframes lineA{to{width:min(72%,300px)}}
  @keyframes lineB{to{width:min(72%,300px)}}

  /* the button now only replays it: swapping the animation name restarts everything */
  #bloom:checked ~ .wrap .grow{animation-name:growB}
  #bloom:checked ~ .wrap .leaf-g{animation-name:leafB}
  #bloom:checked ~ .wrap .petal{animation-name:petalB}
  #bloom:checked ~ .wrap .stamens{animation-name:stamB}
  #bloom:checked ~ .wrap .wash{animation-name:washB}
  #bloom:checked ~ .wrap .paperback,
  #bloom:checked ~ .wrap .paperfront{animation-name:paperB}
  #bloom:checked ~ .wrap .cutends{animation-name:cutB}
  #bloom:checked ~ .wrap .ribbon{animation-name:ribbonB}
  #bloom:checked ~ .wrap .ink{animation-name:inkB}
  #bloom:checked ~ .wrap .underline{animation-name:lineB}

  .btn{
    display:flex;align-items:center;justify-content:center;
    width:fit-content;min-height:44px;margin:clamp(10px,2.6vw,20px) auto 0;
    padding:0 28px;cursor:pointer;
    font-family:"Iowan Old Style",Palatino,Georgia,serif;
    font-size:clamp(10px,2.8vw,11px);letter-spacing:.34em;text-transform:uppercase;
    text-indent:.34em;color:#e7cf9a;
    border:1px solid rgba(231,207,154,.32);border-radius:999px;
    background:rgba(255,255,255,.05);
    transition:background .4s ease,border-color .4s ease;
    user-select:none;-webkit-user-select:none;
  }
  .btn:active{background:rgba(231,207,154,.14);}
  @media (hover:hover){.btn:hover{background:rgba(231,207,154,.1);border-color:rgba(231,207,154,.6);}}
  .trigger:focus-visible ~ .wrap .btn{outline:2px solid #e7cf9a;outline-offset:3px;}
  .btn .b{display:none}
  #bloom:checked ~ .wrap .btn .a{display:none}
  #bloom:checked ~ .wrap .btn .b{display:inline}



  @media (prefers-reduced-motion:reduce){
    .glitter{display:none}
    .grow,.leaf-g,.petal,.wash,.stamens,.ink,.underline,.ribbon,.cutends,.paperback,.paperfront{
      animation-duration:.5s !important;animation-delay:0s !important;}
    .head{animation:none}
  }

  /* ---- dusk sky: deep violet overhead falling to near black at the base ---- */
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:
      radial-gradient(120% 78% at 50% 6%, #34294f 0%, #241f3a 38%, #161829 68%, #0c0e17 100%);
  }
  .moon{
    position:absolute;top:7%;right:11%;width:84px;height:84px;border-radius:50%;
    background:radial-gradient(circle at 38% 34%,rgba(255,247,225,.5),rgba(255,240,205,.16) 46%,rgba(255,240,205,0) 72%);
    filter:blur(.4px);
    animation:moonrise 6s ease-out both;
  }
  @keyframes moonrise{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}

  .stars i{
    position:absolute;width:var(--s);height:var(--s);border-radius:50%;
    background:radial-gradient(circle,#fff 0%,rgba(255,247,230,.75) 45%,rgba(255,247,230,0) 75%);
    opacity:0;
    animation:starfade 2.4s ease var(--d) both, twinkleStar var(--t) ease-in-out var(--d) infinite alternate;
  }
  @keyframes starfade{to{opacity:var(--o)}}
  @keyframes twinkleStar{from{opacity:calc(var(--o)*.22)}to{opacity:var(--o)}}

  /* light gathering behind the bouquet as it opens */
  .halo{
    position:absolute;left:50%;top:40%;width:min(150vw,900px);height:min(110vh,760px);
    transform:translate(-50%,-50%) scale(.86);
    background:radial-gradient(ellipse at center,
      rgba(255,214,170,.20) 0%, rgba(214,150,190,.13) 34%,
      rgba(120,110,190,.07) 58%, rgba(0,0,0,0) 76%);
    opacity:0;
    animation:haloin 5s ease 3.4s both, halobreathe 17s ease-in-out 8s infinite alternate;
  }
  @keyframes haloin{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes halobreathe{from{opacity:.82}to{opacity:1}}

  /* thin gold rule, like the edge of a card */
  .frame{
    position:fixed;inset:clamp(7px,2.2vw,14px);z-index:9;pointer-events:none;
    border:1px solid rgba(226,196,138,.20);border-radius:3px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);
    opacity:0;animation:framein 2.6s ease 1.2s both;
  }
  @keyframes framein{to{opacity:1}}

  /* ---- petals and gold dust, drifting once the bouquet is open ---- */
  .fallfield{position:fixed;inset:-14vh 0 0;pointer-events:none;z-index:5;overflow:hidden;}
  .drift{
    position:absolute;top:0;left:var(--x);opacity:0;
    animation:driftdown var(--t) linear calc(var(--d) + var(--lead,0s)) infinite;
    will-change:transform;
  }
  .drift.petal{
    width:var(--w);height:var(--h);
    background:linear-gradient(135deg,var(--c1));
    border-radius:100% 0 100% 0;
    filter:blur(.2px);
  }
  .drift.dust{
    width:var(--w);height:var(--w);border-radius:50%;
    background:radial-gradient(circle at 40% 36%,#fff 0%,var(--c1) 45%,rgba(255,255,255,0) 74%);
  }
  /* a petal tips over as it falls; dust just floats */
  @keyframes driftdown{
    0%  {transform:translate3d(0,-6vh,0) rotate(var(--tilt,0deg));opacity:0}
    6%  {opacity:var(--o)}
    50% {transform:translate3d(var(--dx),52vh,0) rotate(calc(var(--tilt,0deg) + 190deg))}
    90% {opacity:var(--o)}
    100%{transform:translate3d(calc(var(--dx) * -.4),116vh,0) rotate(calc(var(--tilt,0deg) + 340deg));opacity:0}
  }
  #bloom:checked ~ .fallfield .drift{animation-name:driftdownB}
  @keyframes driftdownB{
    0%  {transform:translate3d(0,-6vh,0) rotate(var(--tilt,0deg));opacity:0}
    6%  {opacity:var(--o)}
    50% {transform:translate3d(var(--dx),52vh,0) rotate(calc(var(--tilt,0deg) + 190deg))}
    90% {opacity:var(--o)}
    100%{transform:translate3d(calc(var(--dx) * -.4),116vh,0) rotate(calc(var(--tilt,0deg) + 340deg));opacity:0}
  }

  /* ---- the welcome card, lifts on tap or by itself after a moment ---- */
  .welcome{
    position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
    background:radial-gradient(120% 80% at 50% 24%, #3a2c56 0%, #241f3a 42%, #10121c 100%);
    animation:veilup 1.2s cubic-bezier(.4,0,.2,1) 4.6s both;
  }
  #enter:checked ~ .welcome{animation:veilup .8s cubic-bezier(.4,0,.2,1) 0s both;}
  @keyframes veilup{
    to{opacity:0;transform:translateY(-2%) scale(1.03);visibility:hidden}
  }
  .wcard{max-width:340px;animation:wcardin 1.4s cubic-bezier(.2,.8,.3,1) .25s both;}
  @keyframes wcardin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .weyebrow{
    margin:0 0 14px;font-size:clamp(10px,2.7vw,11px);letter-spacing:.42em;
    text-transform:uppercase;text-indent:.42em;color:#c9a86a;
  }
  .wbig{
    margin:0 0 12px;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-style:italic;font-size:clamp(22px,6.4vw,30px);line-height:1.3;color:#f6ead6;
    text-shadow:0 0 26px rgba(255,214,160,.22);
  }
  .wsub{
    margin:0 0 30px;font-family:"Iowan Old Style",Palatino,Georgia,serif;
    font-size:clamp(14px,3.9vw,16px);line-height:1.6;color:#bdb2c4;
  }
  .wbtn{
    display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 30px;
    font-family:"Iowan Old Style",Palatino,Georgia,serif;
    font-size:clamp(10px,2.8vw,11px);letter-spacing:.34em;text-transform:uppercase;text-indent:.34em;
    color:#e7cf9a;border:1px solid rgba(231,207,154,.34);border-radius:999px;
    background:rgba(255,255,255,.05);cursor:pointer;user-select:none;-webkit-user-select:none;
    animation:btnpulse 2.6s ease-in-out 1.6s infinite;
  }
  .wbtn:active{background:rgba(231,207,154,.16);}
  @keyframes btnpulse{
    0%,100%{box-shadow:0 0 0 0 rgba(231,207,154,0)}
    50%{box-shadow:0 0 22px 2px rgba(231,207,154,.16)}
  }

  /* ---- the four gif pages, between the welcome card and the bouquet ---- */
  .gifpage{
    position:fixed;inset:0;z-index:11;
    display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
    background:radial-gradient(120% 80% at 50% 24%, #3a2c56 0%, #241f3a 42%, #10121c 100%);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .55s ease, visibility 0s linear .55s;
  }
  /* page one waits underneath the welcome card, so lifting the card reveals it */
  .gp1,
  #g1:checked ~ .gp2,
  #g2:checked ~ .gp3,
  #g3:checked ~ .gp4{
    opacity:1;visibility:visible;pointer-events:auto;
    transition:opacity .55s ease, visibility 0s;
  }
  /* each page steps aside once its own button is pressed */
  #g1:checked ~ .gp1,
  #g2:checked ~ .gp2,
  #g3:checked ~ .gp3,
  #g4:checked ~ .gp4{
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .55s ease, visibility 0s linear .55s;
  }
  .gcard{max-width:min(460px,100%);}
  .gimg{
    display:block;margin:0 auto clamp(18px,4.5vw,28px);
    width:auto;height:auto;
    max-width:min(440px,90vw);
    max-height:min(56svh,430px);
    border-radius:10px;background:#0d0f18;
    box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 1px rgba(231,207,154,.16);
  }
  #enter:focus-visible ~ .welcome .wbtn,
  #g1:focus-visible ~ .gp1 .wbtn,
  #g2:focus-visible ~ .gp2 .wbtn,
  #g3:focus-visible ~ .gp3 .wbtn,
  #g4:focus-visible ~ .gp4 .wbtn{outline:2px solid #e7cf9a;outline-offset:3px;}

  /* The bouquet no longer waits on a timer. It is held still until the last
     page hands off, so its opening always plays from the very beginning
     however long the reader lingers on the gifs. */
  .wrap,.fallfield{--lead:0s}
  .wrap,.wrap *,.fallfield,.fallfield *{animation-play-state:paused}
  #g4:checked ~ .wrap,#g4:checked ~ .wrap *,
  #g4:checked ~ .fallfield,#g4:checked ~ .fallfield *{animation-play-state:running}
  .grow{animation-delay:calc(var(--d,0s) + var(--lead))}
  .leaf-g,.petal,.stamens,.wash{animation-delay:calc(var(--d) + var(--lead))}
  .paperback{animation-delay:calc(.2s + var(--lead))}
  .paperfront{animation-delay:calc(2s + var(--lead))}
  .cutends{animation-delay:calc(.4s + var(--lead))}
  .ribbon{animation-delay:calc(2.5s + var(--lead))}
  .ink{animation-delay:calc(9.3s + var(--lead))}
  .underline{animation-delay:calc(12.5s + var(--lead))}
</style>
</head>
<body>

<input type="checkbox" id="enter" class="trigger" aria-label="Open the card">
<input type="checkbox" id="g1" class="trigger" aria-label="Go to the second page">
<input type="checkbox" id="g2" class="trigger" aria-label="Go to the third page">
<input type="checkbox" id="g3" class="trigger" aria-label="Go to the fourth page">
<input type="checkbox" id="g4" class="trigger" aria-label="Go on to the flowers">
<input type="checkbox" id="bloom" class="trigger" aria-label="Play the bouquet again">

<div class="welcome" aria-hidden="false">
  <div class="wcard">
    <p class="weyebrow">a little something</p>
    <p class="wbig">Somebody picked flowers for you.</p>
    <p class="wsub">They are still closed. Open them and see.</p>
    <label class="wbtn" for="enter">Open the flowers</label>
  </div>
</div>

<div class="gifpage gp1">
  <div class="gcard">
    <img class="gimg" src="giphy4.gif" width="480" height="270" decoding="async"
         alt="A couple in a quiet moment, one leaning close to the other">
    <label class="wbtn" for="g1">Next</label>
  </div>
</div>

<div class="gifpage gp2">
  <div class="gcard">
    <img class="gimg" src="giphy1.gif" width="400" height="200" decoding="async"
         alt="A couple close together, with the words &quot;I don't want anyone but you.&quot;">
    <label class="wbtn" for="g2">Next</label>
  </div>
</div>

<div class="gifpage gp3">
  <div class="gcard">
    <img class="gimg" src="giphy3.gif" width="480" height="480" decoding="async"
         alt="Someone lifting their partner up into their arms">
    <label class="wbtn" for="g3">Next</label>
  </div>
</div>

<div class="gifpage gp4">
  <div class="gcard">
    <img class="gimg" src="giphy2.gif" width="500" height="282" decoding="async"
         alt="A couple sitting together on the sand, watching the sunset">
    <label class="wbtn" for="g4">See the flowers</label>
